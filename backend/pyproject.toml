[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlb-analyzer-backend"
version = "0.1.0"
description = "Backend for the MLB pitch matchup analyzer"
requires-python = ">=3.10,<4"
dependencies = [
    "certifi>=2024.8",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.5,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
